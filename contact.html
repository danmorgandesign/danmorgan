<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact — Dan Morgan</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'system-ui', '-apple-system', 'sans-serif'],
          }
        }
      }
    }
  </script>
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,300;0,14..32,400;0,14..32,500;0,14..32,600;0,14..32,700;1,14..32,400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body { font-family: 'Inter', system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  </style>
</head>
<body class="bg-white text-gray-900">

  <!-- Nav -->
  <nav class="sticky top-0 z-50 bg-white/90 backdrop-blur-md border-b border-gray-100">
    <div class="max-w-6xl mx-auto px-6 h-14 flex items-center justify-between">
      <a href="index.html" class="block w-9 h-9 rounded-full overflow-hidden ring-2 ring-gray-200 hover:ring-gray-400 transition-all duration-150" aria-label="Home">
        <img src="images/crisp-profile.jpg" alt="Dan Morgan" class="w-full h-full object-cover object-top">
      </a>
      <div class="flex items-center gap-3">
        <a href="about.html" class="hidden sm:inline-flex items-center gap-2 text-[0.9375rem] font-medium text-gray-500 px-4 py-2 border border-gray-200 rounded-full transition-all duration-200 hover:text-gray-900 hover:border-gray-400">About</a>
        <a href="portfolio.html" class="hidden sm:inline-flex items-center gap-2 text-[0.9375rem] font-medium text-gray-500 px-4 py-2 border border-gray-200 rounded-full transition-all duration-200 hover:text-gray-900 hover:border-gray-400">Portfolio</a>
      </div>
    </div>
  </nav>

  <main>

    <!-- ── Header ────────────────────────────────────────── -->
    <header class="max-w-6xl mx-auto px-6 pt-16 pb-14">
      <p class="text-[0.6875rem] font-semibold uppercase tracking-widest text-gray-400 mb-3">Get in touch</p>
      <h1 class="text-5xl sm:text-6xl font-light tracking-tight leading-[1.05] text-gray-900 mb-5">Let's talk</h1>
      <p class="text-xl text-gray-400 font-light leading-relaxed max-w-xl">Have a project, a role, or just a question? Send me a message and I'll get back to you.</p>
      <p class="text-base text-gray-400 mt-3">Prefer email? <a data-mailto-link href="#" class="text-gray-600 underline decoration-gray-300 underline-offset-2 hover:text-gray-900 hover:decoration-gray-900 transition-colors"></a></p>
    </header>

    <div class="max-w-6xl mx-auto px-6"><hr class="border-gray-100"></div>

    <!-- ── Form ──────────────────────────────────────────── -->
    <section class="max-w-6xl mx-auto px-6 py-16">
      <form data-contact-form class="max-w-xl space-y-5">

        <!-- Honeypot — hidden from sighted users, real browsers leave it unchecked; bots that fill every field trip it -->
        <div class="hidden" aria-hidden="true">
          <label for="contact-botcheck">Leave this field blank</label>
          <input type="checkbox" id="contact-botcheck" name="botcheck" tabindex="-1" autocomplete="off">
        </div>

        <div>
          <label for="contact-name" class="block text-sm font-medium text-gray-700 mb-1.5">Name</label>
          <input type="text" id="contact-name" name="name" required maxlength="100" autocomplete="name"
            class="w-full px-4 py-3 rounded-xl border border-gray-200 text-gray-900 placeholder:text-gray-400 focus:outline-none focus:ring-2 focus:ring-gray-300 focus:border-gray-400 transition-all"
            placeholder="Your name">
        </div>

        <div>
          <label for="contact-email" class="block text-sm font-medium text-gray-700 mb-1.5">Email</label>
          <input type="email" id="contact-email" name="email" required maxlength="254" autocomplete="email"
            class="w-full px-4 py-3 rounded-xl border border-gray-200 text-gray-900 placeholder:text-gray-400 focus:outline-none focus:ring-2 focus:ring-gray-300 focus:border-gray-400 transition-all"
            placeholder="you@example.com">
        </div>

        <div>
          <label for="contact-message" class="block text-sm font-medium text-gray-700 mb-1.5">Message</label>
          <textarea id="contact-message" name="message" required minlength="10" maxlength="5000" rows="6" autocomplete="off"
            class="w-full px-4 py-3 rounded-xl border border-gray-200 text-gray-900 placeholder:text-gray-400 focus:outline-none focus:ring-2 focus:ring-gray-300 focus:border-gray-400 transition-all resize-none"
            placeholder="What's on your mind?"></textarea>
        </div>

        <input type="hidden" name="subject" value="New message from danmorgandesign.com">
        <input type="hidden" name="from_name" value="Portfolio contact form">

        <button type="submit" class="inline-flex items-center gap-2 text-[0.9375rem] font-medium text-white bg-gray-900 px-6 py-3 rounded-full transition-all duration-200 hover:bg-gray-700">
          Send message
        </button>

        <p data-form-status class="text-sm mt-4" role="status" aria-live="polite"></p>
      </form>
    </section>

  </main>

  <!-- Footer -->
  <footer class="max-w-6xl mx-auto px-6 py-12 border-t border-gray-100 flex items-center justify-between flex-wrap gap-4">
    <a href="https://www.linkedin.com/in/dan-morgan-design/" target="_blank" rel="noopener noreferrer" class="inline-flex items-center gap-2 text-[0.9375rem] font-medium text-gray-500 no-underline px-4 py-2.5 border border-gray-200 rounded-full transition-all duration-200 hover:text-[#0A66C2] hover:border-[#0A66C2] hover:bg-[#0A66C2]/[0.06]">
      <svg class="w-[1.125rem] h-[1.125rem]" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
        <path d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433c-1.144 0-2.063-.926-2.063-2.065 0-1.138.92-2.063 2.063-2.063 1.14 0 2.064.925 2.064 2.063 0 1.139-.925 2.065-2.064 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z"/>
      </svg>
      LinkedIn
    </a>
    <span class="text-sm text-gray-300">Dan Morgan — Product Designer</span>
  </footer>

  <script src="contact-form.js"></script>
</body>
</html>
