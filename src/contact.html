layout: base.njk
title: Contact — Dan Morgan
nav: contact
permalink: contact.html
---

    <!-- ── Header ────────────────────────────────────────── -->
    <header class="max-w-6xl mx-auto px-6 pt-16 pb-14">
      <p class="text-[0.6875rem] font-semibold uppercase tracking-widest text-gray-400 mb-3">Get in touch</p>
      <h1 class="text-5xl sm:text-6xl font-light tracking-tight leading-[1.05] text-gray-900 mb-5">Let's talk</h1>
      <p class="text-xl text-gray-400 font-light leading-relaxed max-w-xl">Have a project, a role, or just a question? Send me a message and I'll get back to you.</p>
      <p class="text-base text-gray-400 mt-3">Prefer email? <button type="button" data-copy-email aria-live="polite" class="text-gray-600 underline decoration-gray-300 underline-offset-2 hover:text-gray-900 hover:decoration-gray-900 transition-colors bg-transparent border-0 p-0 cursor-pointer [font:inherit]"></button></p>
    </header>

    <div class="max-w-6xl mx-auto px-6"><hr class="border-gray-100"></div>

    <!-- ── Form ──────────────────────────────────────────── -->
    <section class="max-w-6xl mx-auto px-6 py-16">
      <form data-contact-form class="max-w-xl space-y-5">

        <!-- Honeypot — hidden from sighted users, real browsers leave it unchecked; bots that fill every field trip it -->
        <div class="hidden" aria-hidden="true">
          <label for="contact-botcheck">Leave this field blank</label>
          <input type="checkbox" id="contact-botcheck" name="botcheck" tabindex="-1" autocomplete="off">
        </div>

        <div>
          <label for="contact-name" class="block text-sm font-medium text-gray-700 mb-1.5">Name</label>
          <input type="text" id="contact-name" name="name" required maxlength="100" autocomplete="name"
            class="w-full px-4 py-3 rounded-xl border border-gray-200 text-gray-900 placeholder:text-gray-400 focus:outline-none focus:ring-2 focus:ring-gray-300 focus:border-gray-400 transition-all"
            placeholder="Your name">
        </div>

        <div>
          <label for="contact-email" class="block text-sm font-medium text-gray-700 mb-1.5">Email</label>
          <input type="email" id="contact-email" name="email" required maxlength="254" autocomplete="email"
            class="w-full px-4 py-3 rounded-xl border border-gray-200 text-gray-900 placeholder:text-gray-400 focus:outline-none focus:ring-2 focus:ring-gray-300 focus:border-gray-400 transition-all"
            placeholder="you@example.com">
        </div>

        <div>
          <label for="contact-message" class="block text-sm font-medium text-gray-700 mb-1.5">Message</label>
          <textarea id="contact-message" name="message" required minlength="10" maxlength="5000" rows="6" autocomplete="off"
            class="w-full px-4 py-3 rounded-xl border border-gray-200 text-gray-900 placeholder:text-gray-400 focus:outline-none focus:ring-2 focus:ring-gray-300 focus:border-gray-400 transition-all resize-none"
            placeholder="What's on your mind?"></textarea>
        </div>

        <input type="hidden" name="subject" value="New message from danmorgandesign.com">
        <input type="hidden" name="from_name" value="Portfolio contact form">

        <button type="submit" class="inline-flex items-center gap-2 text-[0.9375rem] font-medium text-white bg-gray-900 px-6 py-3 rounded-full transition-all duration-200 hover:bg-gray-700">
          Send message
        </button>

        <p data-form-status class="text-sm mt-4" role="status" aria-live="polite"></p>
      </form>
    </section>
